services:
  banco:
    image: postgres:16-alpine
    container_name: dw_olist_banco
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dw_olist
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - dw_olist_dados_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  etl:
    build: .
    container_name: dw_olist_etl
    depends_on:
      banco:
        condition: service_healthy
    environment:
      PGHOST: banco
      PGPORT: 5432
      PGDATABASE: dw_olist
      PGUSER: postgres
      PGPASSWORD: postgres
    volumes:
      - ./data:/app/data
      - ./olap:/app/olap

volumes:
  dw_olist_dados_postgres:
